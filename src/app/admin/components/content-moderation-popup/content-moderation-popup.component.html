@if (adminMenu.activePopup() === 'content-moderation') {
  <app-popup [model]="model()" [zIndex]="2470">
    @if (error()) { <p role="alert">{{ 'moderation.failed' | i18n }}</p> }
    <app-smart-list [config]="config" [loadPage]="loadPage" [query]="query" [itemTemplate]="rowTemplate" (menuItemSelect)="decide($event)"></app-smart-list>
    <ng-template #rowTemplate let-item let-openMenu="openMenu">
      <single-row [row]="row(item)" [clickable]="true" [useSharedMenu]="true"
        (rowClick)="openItem(item)" (menuRequest)="openMenu($event)"></single-row>
    </ng-template>
  </app-popup>
  @defer (when groups.editor()) {
    @if (groups.editor(); as editor) {
      <app-community-group-editor [group]="editor.group" [readOnly]="true" [zIndex]="2500"></app-community-group-editor>
    }
  }
}
@if (settingsDraft(); as draft) {
  <app-popup [model]="settingsModel()" [zIndex]="2480">
    <div class="moderation-settings">
      <app-menu kind="inline" [items]="enabledItems()" (itemSelect)="toggleEnabled()"></app-menu>
      <fieldset class="moderation-settings__parameters" [disabled]="saving() || !draft.enabled">
        <div class="moderation-settings__automatic">
          <app-menu kind="inline" [items]="autoItems()" (itemSelect)="toggleAuto()"></app-menu>
          <label>{{ 'moderation.delayMinutes' | i18n }}
            <input type="number" min="0" max="43200" step="1" [ngModel]="draft.delayMinutes" (ngModelChange)="delay($event)"
              [disabled]="saving() || !draft.enabled || !draft.autoApprove" [readOnly]="!draft.enabled || !draft.autoApprove">
          </label>
        </div>
        <div class="moderation-settings__categories">
          <label id="moderation-categories-label">{{ 'moderation.categories' | i18n }}</label>
          <app-menu kind="select" [trigger]="{ label: selectedCategoriesLabel(), ariaLabel: 'moderation.categories', icon: 'category', palette: 'blue', layout: 'field', disabled: saving() || !draft.enabled }"
            [items]="categoryItems()" (itemSelect)="toggleCategory($event)"></app-menu>
        </div>
      </fieldset>
      @if (error()) { <p role="alert">{{ 'moderation.failed' | i18n }}</p> }
    </div>
  </app-popup>
}
