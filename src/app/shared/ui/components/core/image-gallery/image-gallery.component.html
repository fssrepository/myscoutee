<app-image-carousel
  [slotCount]="1" [compact]="true" [autoSize]="true" slotImageVariant="medium"
  [disabled]="readOnly" [expandable]="true" [ariaLabel]="title"
  [galleryImageCount]="images.length"
  [galleryCapacity]="slotCount"
  [uploadOwnerId]="uploadOwnerId" [uploadEntityId]="uploadEntityId"
  [ngModel]="coverImages" (ngModelChange)="updateCover($event)"
  (expand)="openGallery()"
></app-image-carousel>
