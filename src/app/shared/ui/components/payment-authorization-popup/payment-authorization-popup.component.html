@if (authorization.waitingSurface() && sourceUrl(); as url) {
  <app-popup guideContext="admin.payment-authorizations" class="payment-authorization-popup" [model]="popupModel()" [zIndex]="25200">
    <iframe
      #providerFrame
      class="payment-authorization-popup__frame"
      [src]="url"
      [attr.title]="'payment.authorization.waiting.title' | i18n"
      sandbox="allow-scripts allow-same-origin"
    ></iframe>
  </app-popup>
}
