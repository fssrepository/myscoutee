@if (isOpen() || activeUser) {
    <app-popup [model]="profileEditorPopupModel()" [active]="isOpen()">
      @if (activeUser; as user) {
      <div
        class="profile-editor-popup-content"
        [class.profile-editor-popup-content--profile]="panel === 'profile'"
        [class.profile-editor-popup-content--image]="panel === 'image'"
        [class.profile-editor-popup-content--experience]="panel === 'experience'"
      >
          @if (panel === 'profile') {
            <div
              class="profile-editor-wrap"
              [class.profile-editor-wrap-admin]="activeUserUsesCompactProfile()"
            >
              <div class="profile-editor-header-card">
                <app-header-card
                  [model]="profileHeaderCardModel()"
                  (edit)="openImageEditor()"
                ></app-header-card>
                <app-menu
                  class="profile-api-integration-action"
                  kind="inline"
                  layout="row"
                  [model]="profileHeaderActionMenuModel"
                  [items]="profileApiIntegrationActions()"
                  (itemSelect)="onProfileApiIntegrationAction($event)"
                ></app-menu>
              </div>
              <div class="profile-editor-scroll-area">
                <div class="profile-editor-flow-area">
                  <app-form-flow
                    class="profile-editor-flow"
                    [model]="profileEditorFlowModel"
                    [ngModel]="profileEditorData"
                    (ngModelChange)="onProfileDraftChange($event)"
                    [saving]="isProfileSaving()"
                    [disabled]="isProfileSaving()"
                    (action)="onProfileEditorFlowAction($event)"
                    (percent)="onProfileCompletionPercentChange($event)"
                  ></app-form-flow>
                </div>
              </div>
              <app-integration-settings-popup [adminMode]="activeUserIsAdmin()"></app-integration-settings-popup>
            </div>
          }
          <app-menu-outlet (itemSelect)="onProfileEditorDispatchedMenuSelect($event)"></app-menu-outlet>
          @if (panel === 'image') {
            <div class="image-editor-wrap">
              <app-image-carousel
                [previewMode]="true"
                [ngModel]="profileEditorData.profile.images"
                (ngModelChange)="onProfileImagesChange($event)"
                [uploadOwnerId]="user.id"
              ></app-image-carousel>
            </div>
          }
          @if (panel === 'experience') {
            <app-profile-experience-manager
              [ngModel]="profileEditorData.experienceEntries"
              [initialFilter]="experienceFilter"
              [showInlineActions]="true"
              (ngModelChange)="onExperienceEntriesChange($event)"
            ></app-profile-experience-manager>
          }
      </div>
      } @else {
        <app-form-flow [loading]="true"></app-form-flow>
      }
    </app-popup>
}
